apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

dependencies {

    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    //Fre base Library ==============
    implementation 'com.google.firebase:firebase-analytics:22.1.0'
    implementation 'com.google.firebase:firebase-messaging:24.0.1'
    implementation 'com.google.firebase:firebase-messaging:24.0.1'
    implementation 'com.google.firebase:firebase-inappmessaging-display:21.0.0'
   // implementation 'com.google.android.gms:play-services-ads-lite:23.3.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
android {

    signingConfigs {
        debug {
            storeFile file('/home/iap/Desktop/project/coopay-customer-app/key')
            storePassword '123joni'
            keyPassword '123joni'
            keyAlias 'coopkey'
        }
        config {
            keyAlias 'coopkey'
            keyPassword '123joni'
            storePassword '123joni'
            storeFile file('/home/iap/Desktop/project/coopay-customer-app/key')
        }
    }
    compileSdk 34
    defaultConfig {
        applicationId "com.hira.coopay.customer"
        minSdkVersion 24
        targetSdk 34
        versionCode 33
        versionName "1.3.3"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.config
        vectorDrawables.useSupportLibrary = true
        ndk {
            // Filter for architectures supported by Flutter.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

    }
    productFlavors {
    }
    buildTypes {

        release {
            proguardFiles 'proguard-rules.pro', getDefaultProguardFile('proguard-android.txt')
            signingConfig signingConfigs.config
            minifyEnabled = true
           // renderscriptDebuggable = true
        }
    }
    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    namespace 'com.hira.coopay.customer'
    buildToolsVersion '34.0.0'
    ndkVersion '27.1.12297006'

}

apply plugin: 'com.google.gms.google-services'




